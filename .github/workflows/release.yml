name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set manifest version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" '.version = $v' custom_components/edulink/manifest.json > m.json
          mv m.json custom_components/edulink/manifest.json
      - name: Zip integration
        run: cd custom_components/edulink && zip -r ../../edulink.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: edulink.zip
